name: Release

# Push a tag like 0.6.0 to build the plugin with that version and attach the
# jar to a GitHub release. SonarQube installs it from the release asset URL.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set version from tag
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME}" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          sonar-apple-plugin/target/sonar-apple-plugin-${GITHUB_REF_NAME}.jar
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
