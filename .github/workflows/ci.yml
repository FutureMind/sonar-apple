name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: License header check
        run: mvn -B -ntp license:check

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: sonar-apple-plugin
          path: sonar-apple-plugin/target/sonar-apple-plugin-*.jar
          if-no-files-found: error
